{% extends "base.html" %}

{% block title %}Add Contact - Personal Brain{% endblock %}

{% block content %}
<h2>Add Contact</h2>
<form method="POST">
    <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email">
    </div>
    <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone">
    </div>
    <div class="form-group">
        <label>Company</label>
        <input type="text" name="company">
    </div>
    <div class="form-group">
        <label>Role</label>
        <input type="text" name="role">
    </div>
    <div class="form-group">
        <label>Notes</label>
        <textarea name="notes"></textarea>
    </div>
    <button type="submit" class="btn">Save Contact</button>
</form>
{% endblock %}
